version: '3.4'

services:
  escalaspascom:
    image: ${DOCKER_REGISTRY-}escalaspascom
    build:
      context: .
      dockerfile: EscalasPascom/Dockerfile
    environment:      
      - ASPNETCORE_ENVIRONMENT=Production    

  postgresdb: 
    image: postgres:16-alpine
    container_name: postgresdb_local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: escalas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_local
    environment:
      PGADMIN_DEFAULT_EMAIL: clintonnogueirasilva@gmail.com
      PGADMIN_DEFAULT_PASSWORD: dededidi
    ports:
      - "8080:80" 
    depends_on:
      - postgresdb 
    networks:
      - default 

volumes:
  postgres_data: